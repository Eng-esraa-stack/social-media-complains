<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة مؤشرات شكاوى المواطنين — محافظة جنوب سيناء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tabs" id="tabs">
  <button data-tab="dashboard" class="active">لوحة المؤشرات</button>
  <button data-tab="log">سجل الشكاوى</button>
  <button data-tab="lists">القوائم</button>
  <button data-tab="notes">ملاحظات</button>
  <a class="dl" href="متابعة_شكاوى_المواطنين_ولوحة_المؤشرات.xlsx" download>⬇ تحميل ملف الإكسل</a>
</nav>

<main>
<!-- ============ لوحة المؤشرات ============ -->
<section id="tab-dashboard" class="tab active">
  <div class="banner" id="dashTitle"></div>
  <div class="subline" id="dashSub"></div>
  <div class="kpis" id="kpis1"></div>
  <div class="kpis" id="kpis2"></div>
  <div class="charts">
    <div class="card"><h3>توزيع حالات الشكاوى</h3><div class="cv"><canvas id="c-status"></canvas></div></div>
    <div class="card"><h3>الشكاوى حسب القطاع</h3><div class="cv tall"><canvas id="c-sector"></canvas></div></div>
    <div class="card"><h3>الشكاوى حسب المنطقة</h3><div class="cv tall"><canvas id="c-region"></canvas></div></div>
    <div class="card"><h3>الشكاوى حسب درجة الأهمية</h3><div class="cv"><canvas id="c-imp"></canvas></div></div>
    <div class="card"><h3>الشكاوى حسب طبيعة الحل المطلوب</h3><div class="cv"><canvas id="c-nature"></canvas></div></div>
    <div class="card"><h3>الاتجاه الأسبوعي لعدد الشكاوى</h3><div class="cv"><canvas id="c-week"></canvas></div></div>
  </div>
  <div class="sec-title">جداول البيانات الداعمة للرسوم</div>
  <div class="tables" id="tables"></div>
</section>

<!-- ============ السجل ============ -->
<section id="tab-log" class="tab">
  <div class="banner" id="logTitle"></div>
  <div class="subline" id="logSub"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="بحث في نص الشكوى أو العنوان أو الكود…">
    <select id="f-status"></select><select id="f-imp"></select>
    <select id="f-sector"></select><select id="f-region"></select>
    <select id="f-dup"><option value="">مكررة؟ (الكل)</option><option>نعم</option><option>لا</option></select>
    <button id="reset">إعادة ضبط</button>
    <span id="count"></span>
  </div>
  <div class="tablewrap"><table id="log"></table></div>
</section>

<!-- ============ القوائم ============ -->
<section id="tab-lists" class="tab"><div class="banner">القوائم المنسدلة</div><div class="tablewrap"><table id="lists" class="plain"></table></div></section>

<!-- ============ ملاحظات ============ -->
<section id="tab-notes" class="tab"><div class="banner">ملاحظات حول تجهيز الملف</div><ol id="notes" class="notes"></ol></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
